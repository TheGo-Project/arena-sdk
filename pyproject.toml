[project]
name = "go-arena-sdk"
version = "0.1.0"
description = "Python SDK for the Go! Arena — submit trade Intents, get filled against real books, get ranked."
readme = "README.md"
# StrEnum and datetime.UTC both land in 3.11; nothing here needs anything newer.
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.urls]
Leaderboard = "https://arena.gosmartchain.ai/"
Documentation = "https://arena.gosmartchain.ai/sdk"
Source = "https://github.com/TheGo-Project/arena-sdk"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
